[package]
name = "wmfold"
version = "0.3.47"
description = "wmfold - 化学文件资源管理器"
authors = ["Shi Xiaofei"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wmfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# 合并启动器：`wmfold` 启动桌面端，`wmfold -cli` 输出 JSON
name = "wmfold"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 与 -cli 版共享的核心逻辑（化学解析 / 目录列表 / 文件操作 / 数据模型）
wmfold-core = { path = "../wmfold-core" }
# 机器接口（合并进 wmfold：`wmfold -cli`）
wmfold-cli = { path = "../wmfold-cli" }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
# AI 对话：调用 DeepSeek（OpenAI 兼容）接口。使用 rustls + ring，
# 与 tauri-plugin-updater 共用同一套 TLS 依赖，不引入 OpenSSL/Schannel。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", features = ["ring"] }

[target.'cfg(windows)'.dependencies]
# Windows 专用 API：控制台分离（GUI 模式）、DPAPI（远程密码）、窗口定位、驱动器枚举
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[profile.dev]
incremental = true
